# MNIST MLP baseline. Any omitted field uses the pydantic default.
# run_name is optional; if absent it's auto-derived as <stem>_<timestamp>.

model:
  arch: mlp
  hidden_dims: [256]
  activation: relu
  dropout: 0.0

data:
  batch_size: 128
  eval_batch_size: 256
  num_workers: 2
  val_split: 0.0
  normalize: true

trainer:
  epochs: 5
  device: auto
  seed: 42
  log_interval: 100
  eval_every_epoch: true
  optimizer:
    name: adam
    lr: 0.001
    weight_decay: 0.0
