# Large MLP intended as the distillation teacher (exercise 2).
# More capacity, regularization, and training budget than baseline.

run_name: teacher

model:
  arch: mlp
  hidden_dims: [512, 256]
  activation: relu
  dropout: 0.2

data:
  batch_size: 128
  eval_batch_size: 256
  num_workers: 2
  normalize: true

trainer:
  epochs: 10
  device: auto
  seed: 42
  log_interval: 200
  eval_every_epoch: true
  optimizer:
    name: adamw
    lr: 3e-4
    weight_decay: 1e-4
